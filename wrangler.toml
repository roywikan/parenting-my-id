# ============================================================
# CLOUDFLARE WORKERS & PAGES CONFIGURATION FOR PARENTING.MY.ID
# ============================================================

name = "parenting-my-id-blog"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages Build Output Directory
pages_build_output_dir = "dist"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "parenting-db"

# Environment Variables
[vars]
SITE_NAME = "Parenting.my.id"
SITE_URL = "https://parenting.my.id"
GITHUB_OWNER = "roywikan"
GITHUB_REPO = "parenting-my-id"
GITHUB_BRANCH = "main"
