# ============================================================
# CLOUDFLARE WORKERS CONFIGURATION FOR PARENTING.MY.ID
# ============================================================

name = "parenting-my-id-blog"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# Static Asset Serving (Cloudflare Workers)
[site]
bucket = "./dist"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "parenting-db"
database_id = "1571067b-8c59-4c1e-bc2f-6181aa6e2966"

# Environment Variables
[vars]
SITE_NAME = "Parenting.my.id"
SITE_URL = "https://parenting.my.id"
GITHUB_OWNER = "roywikan"
GITHUB_REPO = "parenting-my-id"
GITHUB_BRANCH = "main"

# Custom Domain Route Configuration (Opsional)
# [[routes]]
# pattern = "parenting.my.id/*"
# zone_name = "parenting.my.id"
